# ── Assets ───────────────────────────────────────────────────────────────────
assets:
  favicon: /favicon.svg
  logo: null # path to an image in app/static, or null to show app_name as text
  menu_art: # character art on the command menu; null shows the star pattern
    default: null # e.g. /art/makoto.png (put the file in app/static/art)
    commands: {} # a different image per command, e.g. budgets: /art/makoto-budgets.png
