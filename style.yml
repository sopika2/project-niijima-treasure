# ─────────────────────────────────────────────────────────────────────────────
#  Niijima Treasury · style.yml
#
#  The one file that controls how the app looks and what it calls things.
#  Edit it like a stylesheet; the logic never changes.
#
#  • Save the file and the running app picks it up within a second.
#  • A typo or an invalid value is rejected with a message naming the exact line,
#    and the app keeps the last good version until you fix it.
#  • Anything you delete falls back to the built-in default.
#  • Check it any time with:  pnpm style:check path/to/style.yml
#
#  Value formats
#    colors   "#e5243b", "#e5243b80", "rgb(229 36 59)", "oklch(62% 0.22 25)", "transparent"
#    sizes    16px, 1.25rem, 0.5em, 50%, 0
#    times    120ms, 0.4s
#    angles   -6deg
# ─────────────────────────────────────────────────────────────────────────────

meta:
  name: Niijima # a name for this look, shown on the System page

# ── Colors ───────────────────────────────────────────────────────────────────
# Every color exists twice: once for the dark scheme and once for the light one.
colors:
  scheme: dark # dark | light | auto (follow the device setting)

  dark:
    background: '#000000' # page behind everything
    surface: '#141414' # cards, panels, sheets
    surface_raised: '#232323' # menus, popovers, hovered rows
    border: '#3a3a3a'
    text: '#ffffff'
    text_muted: '#b4b0aa' # labels, hints, secondary numbers
    accent: '#e8132b' # Makoto red: the sidebar, buttons, focus, the active item
    accent_text: '#ffffff' # text drawn on top of accent
    secondary: '#3f7ce8' # Sae blue: transfers, info, Sae's side
    secondary_text: '#ffffff'
    income: '#39d98a'
    expense: '#ff5d6c'
    success: '#39d98a'
    warning: '#ffc23d'
    danger: '#ff4258'
    focus_ring: '#ffffff'
    overlay: '#000000cc' # dimmed backdrop behind dialogs
    paper: '#ffffff' # a selected row flips to ink on paper
    ink: '#000000'
    cursor: '#22e3f0' # the cyan shard behind the highlighted menu command

  light:
    background: '#f2efe9'
    surface: '#ffffff'
    surface_raised: '#e9e5dd'
    border: '#cfc9bf'
    text: '#000000'
    text_muted: '#55504a'
    accent: '#d10f25'
    accent_text: '#ffffff'
    secondary: '#2459c4'
    secondary_text: '#ffffff'
    income: '#11804f'
    expense: '#c4202f'
    success: '#11804f'
    warning: '#9a6400'
    danger: '#c4202f'
    focus_ring: '#000000'
    overlay: '#000000aa'
    paper: '#000000'
    ink: '#ffffff'
    cursor: '#22e3f0' # the cyan shard behind the highlighted menu command

# ── Typography ───────────────────────────────────────────────────────────────
typography:
  # Optional extra stylesheets to load fonts from (https only). Anton, Barlow Semi Condensed,
  # Abril Fatface and Bowlby One ship with the app, so they work with nothing here.
  import: []
  font_body: '"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif'
  font_heading: 'Anton, Impact, "Arial Black", sans-serif'
  font_numbers: '"Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif'
  # Cut-out letters (page titles, the menu) pick from these in turn, like a ransom note.
  # Abril Fatface and Bowlby One ship with the app too.
  font_ransom:
    - 'Anton, Impact, sans-serif'
    - '"Abril Fatface", Georgia, serif'
    - '"Bowlby One", Anton, sans-serif'
    - '"Barlow Semi Condensed", "Arial Narrow", sans-serif'
  base_size: 17px
  line_height: 1.45
  size:
    xs: 0.78rem
    sm: 0.9rem
    md: 1rem
    lg: 1.3rem
    xl: 1.9rem
    xxl: 3rem
  weight:
    regular: 400
    medium: 500
    bold: 700
    heading: 400 # Anton has one weight; it is already heavy
  heading_case: uppercase # none | uppercase | lowercase | capitalize
  heading_letter_spacing: 0.02em
  heading_italic: true # slanted headings
  tabular_numbers: true # numbers line up in columns
  title_style: ransom # ransom (cut-out letters, calling-card style) | plain

# ── Shape ────────────────────────────────────────────────────────────────────
shape:
  spacing:
    xs: 4px
    sm: 8px
    md: 16px
    lg: 24px
    xl: 40px
  radius:
    sm: 0
    md: 0
    lg: 0
    pill: 999px
  border_width: 2px
  accent_border_width: 4px # the bold stripe on highlighted cards
  shadow:
    card: none
    raised: '8px 8px 0 #e8132b' # sheets and dialogs: a hard red shadow
  skew: -10deg # slant of tags, badges, buttons and the selected item; 0deg turns it off
  cut_corner: 18px # clipped top-right corner on cards; 0px for square corners

# ── Motion ───────────────────────────────────────────────────────────────────
motion:
  enabled: true
  respect_reduced_motion: true # follow the device's "reduce motion" setting
  duration:
    fast: 120ms
    normal: 220ms
    slow: 420ms
  easing:
    standard: cubic-bezier(0.2, 0.8, 0.2, 1)
    emphasized: cubic-bezier(0.7, 0, 0.2, 1.25) # small overshoot, for menus and selections

# ── Layout ───────────────────────────────────────────────────────────────────
layout:
  max_width: 1180px
  density: comfortable # comfortable | compact
  card_style: cut # flat | outlined | elevated | cut (clipped corner)
  texture: halftone # halftone | stripes | none (pattern behind the page)
  navigation: command # command (top bar + full-screen Persona menu) | sidebar (always-on menu)
  sidebar: accent # with navigation: sidebar — accent (red slab) | surface
  page_transition: slash # slash (red wipe between pages) | none
  dashboard_columns: 2 # columns of widgets on wide screens (1 to 4)
  # Order of dashboard widgets by extension id. Enabled extensions not listed
  # here are added after these, in the order config.yml lists them.
  dashboard_order:
    - spending-this-month
    - status-card

# ── Charts ───────────────────────────────────────────────────────────────────
charts:
  # Category colors, in this fixed order. Checked for color-blind separation and contrast on
  # the dark surface; if you change them, keep neighbours clearly different.
  palette: ['#e66767', '#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9']
  line_width: 2
  curve: monotone # linear | monotone | step
  grid: true
  points: false
  area_opacity: 0.16
  tooltip: card # card | minimal

